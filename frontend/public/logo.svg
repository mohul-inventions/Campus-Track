<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Middle Radar Arc -->
  <circle cx="50" cy="50" r="32" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <!-- Crosshairs -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- Central Pin Target -->
  <path d="M50 24C41.163 24 34 31.163 34 40C34 51.5 50 68 50 68C50 68 66 51.5 66 40C66 31.163 58.837 24 50 24Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="40" r="6" fill="#07090e" />
  <!-- Pulse Dot -->
  <circle cx="50" cy="40" r="2.5" fill="#fde68a" />
</svg>
